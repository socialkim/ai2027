<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 2027 독자 실습실</title>
<meta name="description" content="『AI 2027 트렌드&활용백과』 독자를 위한 실습 페이지.">
<meta property="og:title" content="AI 2027 독자 실습실">
<meta property="og:description" content="『AI 2027 트렌드&활용백과』를 읽으며 바로 따라 해 보는 실습 페이지.">
<meta name="theme-color" content="#FDF7E6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--bg:#FDF7E6;--card:#CDE4F7;--panel:#FFFFFF;--frame:#6696A2;--navy:#125A72;--ink:#111111;--sub:#434646;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14262E;--card:#1F3640;--panel:#18303A;--frame:#5F95A3;--navy:#7CC4DD;--ink:#E8EEF0;--sub:#B9C8CC;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14262E;--card:#1F3640;--panel:#18303A;--frame:#5F95A3;--navy:#7CC4DD;--ink:#E8EEF0;--sub:#B9C8CC;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.65;word-break:keep-all;
  padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 32px) calc(env(safe-area-inset-bottom,0px) + 48px)}
main,footer{max-width:560px;margin:0 auto}
main{display:grid;gap:24px}
h1{margin:0;background:var(--panel);border:2px solid var(--frame);border-radius:16px;padding:12px 16px;text-align:center;font-size:26px;line-height:1.3;color:var(--navy)}
p{margin:0}
.lead{font-size:15px;color:var(--sub);text-align:center}
a.card{display:grid;gap:8px;background:var(--card);border-radius:20px;padding:20px;text-decoration:none;color:var(--ink)}
a.card b{font-size:20px;line-height:1.35}
a.card span{font-size:15px;color:var(--sub)}
a.card em{font-style:normal;font-weight:700;color:var(--navy);font-size:16px}
a.card:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--frame);display:grid;gap:12px;font-size:14px;color:var(--sub)}
footer .ch{display:flex;flex-wrap:wrap;gap:8px}
footer .ch a{display:inline-flex;align-items:center;min-height:40px;padding:4px 14px;border:1px solid var(--frame);border-radius:999px;background:var(--panel);color:var(--ink);text-decoration:none;font-size:15px}
</style>
</head>
<body>
<main>
  <h1>AI 2027 독자 실습실</h1>
  <p class="lead">『AI 2027 트렌드&amp;활용백과』를 읽으며 바로 따라 해 보는 곳입니다.</p>
  <a class="card" href="prompt/">
    <b>위임의 시대에 맞는 프롬프트</b>
    <span>내 일 하나를 명세 6칸으로 채워 AI에게 바로 맡겨 보세요. 위임 문장, 먼저 묻게 하기, 프롬프트 자판기까지.</span>
    <em>명세 6칸 조립기 열기 →</em>
  </a>
</main>
<footer>
  <p>김덕진(IT커뮤니케이션연구소) · 2026년 10월</p>
  <div class="ch" aria-label="저자 채널">
    <a href="https://www.youtube.com/@aidia-v5w" target="_blank" rel="noopener">유튜브 김덕진의 AI디아</a>
    <a href="https://blog.naver.com/itcommunicator" target="_blank" rel="noopener">블로그</a>
    <a href="https://www.instagram.com/itcl_sns/" target="_blank" rel="noopener">인스타그램</a>
    <a href="https://open.kakao.com/o/gQiVg8Bh" target="_blank" rel="noopener">오픈채팅</a>
    <a href="https://litt.ly/socialkim" target="_blank" rel="noopener">모든 채널 보기</a>
  </div>
</footer>
<script>

</script>
</body>
</html>
